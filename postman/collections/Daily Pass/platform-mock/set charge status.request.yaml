$kind: http-request
method: POST
url: '{{mock_url}}/mock/charge-status'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "statusCode": "{{charge_status_code}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('charge status updated', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().chargeStatus).to.eql(
          pm.collectionVariables.get('charge_status_code')
        );
      });
