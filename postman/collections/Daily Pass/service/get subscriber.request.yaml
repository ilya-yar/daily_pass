$kind: http-request
method: GET
url: '{{service_url}}/subscribers/:subscriberId'
order: 3000
pathVariables:
  - key: subscriberId
    value: '{{msisdn}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('subscriber found', () => {
        pm.response.to.have.status(200);
        const body = pm.response.json();
        pm.expect(body.subscriberId).to.eql(pm.collectionVariables.get('msisdn'));
        pm.expect(body.status).to.be.a('string');
      });
